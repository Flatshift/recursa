[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli", "crates/desktop"]
default-members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.3.10"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/flatshift/recursa"

[workspace.dependencies]
recursa-engine = { path = "crates/engine", default-features = false }
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc"] }
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
h2 = "0.4.20"
http = "1.5.0"
libc = "0.2.191"
log = "0.4.29"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
routinator = { version = "0.15.2", default-features = false }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
trippy-core = "=0.13.0"
trippy-privilege = "=0.13.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
webpki-roots = "1.0.11"
