name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RustSec advisories, and the fixes we wait on upstream (docs/PENDING.md). A new advisory fails the run; the pending
  # ones are reported in the run summary, with a warning once their fix can be applied.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit hygiene
        # Every commit carries a DCO sign-off and names a person, not a tool.
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -iE 'claude|anthropic'; then exit 1; fi
          if git log --format=%B | grep -iE '^co-authored-by:.*(claude|anthropic)|^claude-session:'; then exit 1; fi
          for c in $(git rev-list HEAD); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "missing sign-off: $c"; exit 1; }
          done
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - name: Advisories
        run: cargo audit
      - name: Pending fixes
        run: python3 -I tools/pending.py

  # Linux has no test job yet; this keeps the cfg(target_os = "linux") code compiling.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p recursa-engine --all-targets --release -- -D warnings

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Cargo.toml has the version; the app bundles take it from web/package.json (tauri.conf.json).
      - name: One version everywhere
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for f in web/package.json web/package-lock.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then
              echo "$f says $v, but Cargo.toml says $version"
              exit 1
            fi
          done
      - name: Interface
        working-directory: web
        run: |
          npm ci
          npx svelte-check --tsconfig ./tsconfig.json
          npm test
          npm run build
      - name: Third-party notices are current
        run: |
          python3 -I tools/notices.py
          git diff --exit-code -- web/src/legal
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - name: Timing floor
        run: cargo run -p recursa --release -- calibrate
      - name: Kernel stamps on the network
        run: cargo test -p recursa-engine --release -- --ignored --nocapture stamps_on_the_network

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Interface
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - name: Timing floor
        run: cargo run -p recursa --release -- calibrate
      # Windows stamps packets where the adapter hands them up, and only when the driver's software timestamping
      # is on (off by default). Turn it on for the runner's adapter so the stamps can be seen on real traffic. A
      # driver without the property is reported, not an error: the test below then shows the userspace fallback.
      - name: Adapter software timestamps
        shell: pwsh
        continue-on-error: true
        run: |
          Get-NetAdapter -Physical | Set-NetAdapterAdvancedProperty -RegistryKeyword '*SoftwareTimestamp' -RegistryValue 1 -ErrorAction Continue
          Get-NetAdapterAdvancedProperty -AllProperties | Where-Object RegistryKeyword -like '*Timestamp*' | Format-Table Name, RegistryKeyword, RegistryValue
      - name: Kernel stamps on the network
        run: cargo test -p recursa-engine --release -- --ignored --nocapture stamps_on_the_network

  # The iPhone build shares the engine and the interface; this catches a change that compiles for the Mac but not
  # for iOS (the cfg(mobile) paths), then builds the simulator app. Simulator builds need no signing.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
      - name: Interface and Tauri CLI
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo clippy -p recursa-desktop -p recursa-engine --target aarch64-apple-ios --release -- -D warnings
      - name: Simulator app
        working-directory: crates/desktop
        run: |
          ../../web/node_modules/.bin/tauri ios build --debug --target aarch64-sim
          version=$(grep -m1 '^version' ../../Cargo.toml | cut -d'"' -f2)
          v=$(plutil -extract CFBundleShortVersionString raw gen/apple/build/arm64-sim/Recursa.app/Info.plist)
          if [ "$v" != "$version" ]; then
            echo "The iOS app says $v, but Cargo.toml says $version"
            exit 1
          fi

  # Unsigned NSIS installers for testing, on manual runs only; tag pushes build them in release.yml. ARM64 is
  # cross-compiled on the x64 runner with the MSVC ARM64 tools it ships.
  windows-installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Interface and Tauri CLI
        working-directory: web
        run: |
          npm ci
          npm run build
      # tauri.windows.conf.json switches the bundle targets to NSIS.
      - name: Installer
        working-directory: crates/desktop
        shell: bash
        run: ../../web/node_modules/.bin/tauri build --target ${{ matrix.target }} --features custom-protocol
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recursa-windows-${{ matrix.arch }}-setup
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
