name: CI

on:
  push:
    branches: [main, network-beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RustSec advisories, and the fixes we wait on upstream (docs/PENDING.md). A new advisory fails the run; the pending
  # ones are reported in the run summary, with a warning once their fix can be applied.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit hygiene
        # Every commit carries a DCO sign-off and names a person, not a tool. On a pull request HEAD is GitHub's test
        # merge, which nobody signs, so the sign-off walk starts at the branch tip.
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -iE 'claude|anthropic'; then exit 1; fi
          if git log --format=%B | grep -iE '^co-authored-by:.*(claude|anthropic)|^claude-session:'; then exit 1; fi
          for c in $(git rev-list "$TIP"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "missing sign-off: $c"; exit 1; }
          done
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: Advisories
        run: cargo audit
      - name: Pending fixes
        run: python3 -I tools/pending.py

  # Linux has no test job yet; this keeps the cfg(target_os = "linux") code compiling.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p recursa-engine --all-targets --release -- -D warnings

  macos:
    runs-on: macos-latest
    permissions:
      contents: write # the notices step commits to Dependabot branches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Cargo.toml has the version; the app bundles take it from web/package.json (tauri.conf.json).
      - name: One version everywhere
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for f in web/package.json web/package-lock.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then
              echo "$f says $v, but Cargo.toml says $version"
              exit 1
            fi
          done
      - name: Interface
        working-directory: web
        run: |
          npm ci
          npx svelte-check --tsconfig ./tsconfig.json
          npm test
          npm run build
      # Dependabot bumps the lockfiles without regenerating the notices, so on its pull requests the step commits the
      # regenerated file to the branch instead of failing; the rest of the job then runs on that tree. GitHub holds the
      # run for the pushed commit until someone approves it. Everywhere else a stale file fails the run.
      - name: Third-party notices are current
        env:
          DEPENDABOT: >-
            ${{ github.event.pull_request.user.login == 'dependabot[bot]'
            && github.event.pull_request.head.repo.full_name == github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$DEPENDABOT" = true ]; then
            git fetch --depth=1 origin "refs/heads/$BRANCH"
            git checkout --detach FETCH_HEAD
          fi
          python3 -I tools/notices.py
          git diff --quiet -- web/src/legal && exit 0
          if [ "$DEPENDABOT" != true ]; then
            git diff -- web/src/legal
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'Update third-party notices' -- web/src/legal
          git push origin "HEAD:refs/heads/$BRANCH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - name: Timing floor
        run: cargo run -p recursa --release -- calibrate
      - name: Kernel stamps on the network
        run: cargo test -p recursa-engine --release -- --ignored --nocapture stamps_on_the_network

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Interface
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
      - name: Timing floor
        run: cargo run -p recursa --release -- calibrate
      # Windows stamps packets where the adapter hands them up, and only when the driver's software timestamping
      # is on (off by default). Turn it on for the runner's adapter so the stamps can be seen on real traffic. A
      # driver without the property is reported, not an error: the test below then shows the userspace fallback.
      - name: Adapter software timestamps
        shell: pwsh
        continue-on-error: true
        run: |
          Get-NetAdapter -Physical | Set-NetAdapterAdvancedProperty -RegistryKeyword '*SoftwareTimestamp' -RegistryValue 1 -ErrorAction Continue
          Get-NetAdapterAdvancedProperty -AllProperties | Where-Object RegistryKeyword -like '*Timestamp*' | Format-Table Name, RegistryKeyword, RegistryValue
      - name: Kernel stamps on the network
        run: cargo test -p recursa-engine --release -- --ignored --nocapture stamps_on_the_network

  # The iPhone build shares the engine and the interface; this catches a change that compiles for the Mac but not
  # for iOS (the cfg(mobile) paths), then builds the simulator app. Simulator builds need no signing.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
      - name: Interface and Tauri CLI
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo clippy -p recursa-desktop -p recursa-engine --target aarch64-apple-ios --release -- -D warnings
      - name: Simulator app
        working-directory: crates/desktop
        run: |
          ../../web/node_modules/.bin/tauri ios build --debug --target aarch64-sim
          version=$(grep -m1 '^version' ../../Cargo.toml | cut -d'"' -f2)
          v=$(plutil -extract CFBundleShortVersionString raw gen/apple/build/arm64-sim/Recursa.app/Info.plist)
          if [ "$v" != "$version" ]; then
            echo "The iOS app says $v, but Cargo.toml says $version"
            exit 1
          fi

  # Unsigned NSIS installers for testing, on manual runs only; tag pushes build them in release.yml.
  windows-installer:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/windows-installer.yml
