name: Release

# Push a v* tag to build the installers and attach them to a draft GitHub Release. Both are unsigned
# (ad-hoc on macOS), so Gatekeeper and SmartScreen will warn until signing is set up.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The installers are named after the crate version, so the tag must match it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG, but Cargo.toml says $version"
            exit 1
          fi

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Interface and Tauri CLI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Universal DMG
        working-directory: crates/desktop
        run: ../../web/node_modules/.bin/tauri build --target universal-apple-darwin --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # x64 and ARM64 NSIS installers; ARM64 is cross-compiled on the x64 runner.
  windows:
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Interface and Tauri CLI
        working-directory: web
        run: |
          npm ci
          npm run build
      # tauri.windows.conf.json switches the bundle targets to NSIS.
      - name: Installer
        working-directory: crates/desktop
        shell: bash
        run: ../../web/node_modules/.bin/tauri build --target ${{ matrix.target }} --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: recursa-windows-${{ matrix.arch }}-setup
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          # The CHANGELOG section for this version, without its heading.
          awk -v v="${TAG#v}" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v; next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Recursa ${TAG#v}" --notes-file notes.md
