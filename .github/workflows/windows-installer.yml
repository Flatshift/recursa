name: Windows installer

# Unsigned NSIS installers, x64 and ARM64, each uploaded as an artifact. ARM64 is cross-compiled on the x64 runner
# with the MSVC ARM64 tools it ships. Called by ci.yml (manual runs) and release.yml (tag pushes).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Interface and Tauri CLI
        working-directory: web
        run: |
          npm ci
          npm run build
      # tauri.windows.conf.json switches the bundle targets to NSIS.
      - name: Installer
        working-directory: crates/desktop
        shell: bash
        run: ../../web/node_modules/.bin/tauri build --target ${{ matrix.target }} --features custom-protocol
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recursa-windows-${{ matrix.arch }}-setup
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
