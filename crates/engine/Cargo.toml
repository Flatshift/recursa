[package]
name = "recursa-engine"
description = "Recursa's measurement engine and application state, shared by the CLI and the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-siv.workspace = true
bytes.workspace = true
bzip2 = "0.6"
dirs.workspace = true
fastrand.workspace = true
flate2.workspace = true
futures-util.workspace = true
h2.workspace = true
http.workspace = true
libc.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

# The route-origin validator runs as a child process, which iOS doesn't allow.
[target.'cfg(not(target_os = "ios"))'.dependencies]
log = { workspace = true, optional = true }
routinator = { workspace = true, optional = true }
trippy-core.workspace = true
trippy-privilege.workspace = true

[target.'cfg(windows)'.dependencies]
# Adapters, their DNS servers and gateways (IP Helper), ICMP echoes for the link check, measurement-thread priority,
# the performance counter and SIO_TIMESTAMPING receive stamps.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[features]
default = ["rpki-local"]
# Route-origin validation on this computer (opt-in in Settings): see the top of `src/rpki/mod.rs` for how to remove it.
rpki-local = ["dep:routinator", "dep:log"]
